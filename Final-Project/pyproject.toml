[project]
name = "discord-steam-game-recommender"
version = "0.1.0"
description = "Discord agent that finds Steam games for a group"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "ddgs>=9.16.0",
    "discord.py>=2.5,<3",
    "httpx>=0.28.1",
    "langchain-openai>=1.7.0",
    "langgraph>=1.2.14",
    "pydantic>=2.0,<3",
    "python-dotenv>=1.2.3",
]
