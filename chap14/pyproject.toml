[project]
name = "chap14"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.4.7",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-openai>=1.7.2",
    "langchain-text-splitters>=1.1.3",
    "tavily-python>=0.8.5",
]

[project.scripts]
